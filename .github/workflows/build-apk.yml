name: Build ANANDA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          rm -rf project
          mkdir -p project
          unzip -q ANANDA_Android_GitHub_Build.zip -d project

          echo "=== PROJECT STRUCTURE ==="
          find project -maxdepth 5 -type f | sort

      - name: Find Android project
        id: android
        run: |
          PROJECT_FILE=$(find project \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          echo "Found settings file:"
          echo "$PROJECT_FILE"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Android project settings.gradle was not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")

          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ steps.android.outputs.project_dir }}
        run: |
          if [ -f "./gradlew" ]; then
            echo "Using Gradle Wrapper"
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Gradle Wrapper not found. Using installed Gradle."
            gradle assembleDebug --stacktrace
          fi

      - name: Find generated APK
        run: |
          echo "=== APK FILES ==="
          find project -type f -name "*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANANDA-APK
          path: project/**/*.apk
          if-no-files-found: error
