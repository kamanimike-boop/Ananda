name: Build ANANDA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir -p project
          unzip -q ANANDA_Android_GitHub_Build.zip -d project

          echo "=== PROJECT STRUCTURE ==="
          find project -maxdepth 5 -type f | sort

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build debug APK
        working-directory: project
        run: |
          gradle assembleDebug --stacktrace

      - name: Find generated APK
        run: |
          echo "=== APK FILES ==="
          find project -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANANDA-APK
          path: project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
