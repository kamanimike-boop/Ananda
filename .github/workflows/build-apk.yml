name: Build ANANDA APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Android project
        run: |
          mkdir project
          unzip -q ANANDA_Android_GitHub_Build.zip -d project
          echo "Project files:"
          find project -maxdepth 3 -type f | head -50

      - name: Find Gradle project
        id: gradle
        run: |
          PROJECT_DIR=$(find project -name gradlew -type f -printf '%h\n' | head -1)
          echo "Found project: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ANANDA-APK
          path: |
            project/**/build/outputs/apk/debug/*.apk
